name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - name: Ensure no deployment files are tracked
        run: |
          if git ls-files | grep -E '(^|/)(state\.json|mihomo\.yaml|\.env|.*\.(pem|key|log))$'; then
            exit 1
          fi
